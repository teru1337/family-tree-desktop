    <rect x="1144" y="10" width="232" height="60" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="1160" y="35" class="label"><tspan x="1160">4. Поиск по именам</tspan><tspan x="1160" dy="20" class="note">Быстро найти человека</tspan></text>
