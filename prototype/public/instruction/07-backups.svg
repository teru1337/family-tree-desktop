    <rect x="1600" y="440" width="174" height="60" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="1614" y="465" class="label"><tspan x="1614">3. Восстановить</tspan><tspan x="1614" dy="20" class="note">Вернуть состояние дерева</tspan></text>
