<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" data-source="source-04-tree.jpg" role="img" aria-label="Дерево с подсказками по перемещению и масштабу">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6e8d52"/></marker>
    <style>.label{font:600 16px Arial,sans-serif;fill:#4e5947}.note{font:400 14px Arial,sans-serif;fill:#6f7769}.line{fill:none;stroke:#6e8d52;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  </defs>
  <path class="line" d="M100 70V112H305V290"/>
  <path class="line" d="M100 250V290H305V384"/>
  <path class="line" d="M100 430V454H305V452"/>
  <path class="line" d="M1690 70V104H1200V554H870"/>
  <g>
    <rect x="18" y="10" width="174" height="60" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="32" y="35" class="label"><tspan x="32">1. Панорамирование</tspan><tspan x="32" dy="20" class="note">Стрелки двигают полотно</tspan></text>
    <rect x="18" y="190" width="174" height="60" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="32" y="215" class="label"><tspan x="32">2. Масштаб</tspan><tspan x="32" dy="20" class="note">Плюс и минус</tspan></text>
    <rect x="18" y="370" width="174" height="60" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="32" y="395" class="label"><tspan x="32">3. Центрирование</tspan><tspan x="32" dy="20" class="note">Вернуть дерево в центр</tspan></text>
    <rect x="1600" y="10" width="174" height="60" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="1614" y="35" class="label"><tspan x="1614">4. Перемещение</tspan><tspan x="1614" dy="20" class="note">Тяните карточку ЛКМ</tspan></text>
  </g>
</svg>
