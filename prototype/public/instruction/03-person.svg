<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" data-source="source-03-person.jpg" data-captured-from="electron-desktop" role="img" aria-label="Мастер добавления человека с подписями шагов и связей"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6e8d52"/></marker><style>.label{font:700 17px Arial,sans-serif;fill:#4e5947}.note{font:400 14.5px Arial,sans-serif;fill:#6f7769}.line{fill:none;stroke:#6e8d52;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs><path class="line" d="M258 44H400V544H1273"/><path class="line" d="M258 866H430V614H1273"/><path class="line" d="M1560 44H1528V371H1429"/><path class="line" d="M1560 234H1540V385H1520"/><path class="line" d="M1560 866H1552V326H1344"/><g><rect x="18" y="10" width="240" height="68" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/><text x="32" y="35" class="label"><tspan x="32">1. Выберите связь</tspan><tspan x="32" dy="20" class="note">Родитель, ребёнок или союз</tspan></text></g><g><rect x="18" y="832" width="240" height="68" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/><text x="32" y="857" class="label"><tspan x="32">2. Уточните ситуацию</tspan><tspan x="32" dy="20" class="note">Неполные сведения допустимы</tspan></text></g><g><rect x="1560" y="10" width="240" height="68" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/><text x="1574" y="35" class="label"><tspan x="1574">3. Заполните известное</tspan><tspan x="1574" dy="20" class="note">Поля можно оставить пустыми</tspan></text></g><g><rect x="1560" y="200" width="240" height="68" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/><text x="1574" y="225" class="label"><tspan x="1574">4. Проверьте запись</tspan><tspan x="1574" dy="20" class="note">Перед сохранением есть обзор</tspan></text></g><g><rect x="1560" y="832" width="240" height="68" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/><text x="1574" y="857" class="label"><tspan x="1574">5. Фото и факты</tspan><tspan x="1574" dy="20" class="note">Фото, источники и события</tspan></text></g></svg>
