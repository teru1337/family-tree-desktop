<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" data-source="source-03-person.jpg" role="img" aria-label="Форма добавления человека с подсказками">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6e8d52"/></marker>
    <style>.label{font:600 16px Arial,sans-serif;fill:#4e5947}.note{font:400 14px Arial,sans-serif;fill:#6f7769}.line{fill:none;stroke:#6e8d52;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  </defs>
  <path class="line" d="M160 222H250V418H1260"/>
  <path class="line" d="M1690 170H1580V644H1360"/>
  <path class="line" d="M1690 352H1550V736H1360"/>
  <path class="line" d="M1690 534H1590V844H1360"/>
  <g>
    <rect x="18" y="188" width="174" height="68" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="32" y="214" class="label"><tspan x="32">1. Выберите связь</tspan><tspan x="32" dy="20" class="note">Родитель, ребёнок или супруг</tspan></text>
    <rect x="1600" y="112" width="174" height="58" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="1614" y="137" class="label"><tspan x="1614">2. Выберите человека</tspan><tspan x="1614" dy="20" class="note">Из списка справа</tspan></text>
    <rect x="1600" y="294" width="174" height="58" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="1614" y="319" class="label"><tspan x="1614">3. Заполните известное</tspan><tspan x="1614" dy="20" class="note">Остальное можно оставить пустым</tspan></text>
    <rect x="1600" y="476" width="174" height="58" rx="10" fill="#f4f8f0" stroke="#b7c8aa"/>
    <text x="1614" y="501" class="label"><tspan x="1614">4. Добавьте фото</tspan><tspan x="1614" dy="20" class="note">По желанию</tspan></text>
  </g>
</svg>
