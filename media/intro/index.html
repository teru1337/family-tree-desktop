<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f5f4ef;
        --ink: #34312c;
        --muted: #6d6a62;
        --sage: #6d8751;
        --sage-soft: #dce5d2;
        --blue: #6e9bc0;
        --rose: #c994a6;
        --line: rgba(109, 135, 81, 0.5);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body { position: relative; }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 15% 20%, rgba(201, 148, 166, 0.18), transparent 30%),
          radial-gradient(circle at 82% 70%, rgba(110, 155, 192, 0.17), transparent 34%),
          var(--paper);
      }

      .ambient,
      .ambient::after,
      .ambient-shimmer {
        position: absolute;
        inset: 0;
        content: "";
        pointer-events: none;
      }

      .ambient-shimmer {
        background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.55) 50%, transparent 80%);
        opacity: 0.45;
      }

      .ambient::after {
        inset: 120px 170px;
        border: 1px solid rgba(109, 135, 81, 0.12);
        border-radius: 48px;
        transform: rotate(-4deg);
      }

      .intro-copy {
        position: absolute;
        left: 150px;
        top: 148px;
        z-index: 2;
        width: 560px;
      }

      .eyebrow {
        color: var(--sage);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 24px 0 22px;
        font-size: 88px;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .subtitle {
        max-width: 500px;
        color: var(--muted);
        font-size: 28px;
        line-height: 1.35;
      }

      .tree-stage {
        position: absolute;
        left: 770px;
        top: 155px;
        width: 1000px;
        height: 700px;
        z-index: 2;
      }

      .tree-stage svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .relation {
        fill: none;
        stroke: var(--line);
        stroke-linecap: round;
        stroke-width: 7;
      }

      .partnership {
        stroke: rgba(181, 119, 61, 0.62);
        stroke-dasharray: 18 14;
      }

      .node rect {
        fill: rgba(255, 254, 250, 0.92);
        stroke: #d7d4cc;
        stroke-width: 3;
      }

      .node.sage rect { stroke: #88a36f; }
      .node.rose rect { stroke: var(--rose); }
      .node.blue rect { stroke: var(--blue); }

      .node text { fill: var(--ink); font-size: 26px; font-weight: 700; }
      .node .note { fill: var(--muted); font-size: 17px; font-weight: 400; }

      .node-shadow { filter: drop-shadow(0 18px 22px rgba(52, 49, 44, 0.1)); }

      .footer {
        position: absolute;
        left: 150px;
        right: 150px;
        bottom: 90px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 2;
        color: var(--muted);
        font-size: 20px;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        color: var(--ink);
        font-weight: 700;
      }

      .mark-dot {
        width: 16px;
        height: 16px;
        margin-right: 48px;
        border-radius: 50%;
        background: var(--sage);
        box-shadow: 24px 0 0 var(--rose), 48px 0 0 var(--blue);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="family-tree-intro" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="ambient-field" class="ambient clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="ambient-shimmer" class="ambient-shimmer"></div>
      </div>

      <section id="intro-copy" class="intro-copy clip" data-start="0.2" data-duration="5.6" data-track-index="1">
        <div id="intro-kicker" class="eyebrow">Локальная история</div>
        <h1 id="intro-title">Семейное<br />древо</h1>
        <p id="intro-subtitle" class="subtitle">Связи, воспоминания и поколения — в одном спокойном пространстве.</p>
      </section>

      <section id="tree-stage" class="tree-stage clip" data-start="0.6" data-duration="5.4" data-track-index="2" aria-label="Обезличенная схема семейных связей">
        <svg viewBox="0 0 1000 700" role="img" aria-label="Три обезличенные карточки и две связи">
          <path id="line-parent" class="relation" d="M 216 164 C 330 164 408 280 560 322" />
          <path id="line-partner" class="relation partnership" d="M 216 520 C 330 520 408 386 560 322" />
          <g id="node-parent" class="node sage node-shadow" transform="translate(0 120)">
            <rect width="216" height="88" rx="18" />
            <text x="24" y="38">Родитель</text>
            <text class="note" x="24" y="66">старшее поколение</text>
          </g>
          <g id="node-partner" class="node rose node-shadow" transform="translate(0 476)">
            <rect width="216" height="88" rx="18" />
            <text x="24" y="38">Партнёр</text>
            <text class="note" x="24" y="66">семейная связь</text>
          </g>
          <g id="node-child" class="node blue node-shadow" transform="translate(560 278)">
            <rect width="260" height="88" rx="18" />
            <text x="24" y="38">Ребёнок</text>
            <text class="note" x="24" y="66">младшее поколение</text>
          </g>
        </svg>
      </section>

      <footer id="intro-footer" class="footer clip" data-start="1.2" data-duration="4.8" data-track-index="3">
        <span class="mark"><span class="mark-dot"></span>family-tree-desktop</span>
        <span>Храните историю семьи на своём компьютере</span>
      </footer>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#intro-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.2);
      tl.fromTo("#intro-title", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.78, ease: "power3.out" }, 0.38);
      tl.fromTo("#intro-subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.72, ease: "power2.out" }, 0.8);
      tl.fromTo("#line-parent", { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 0.75);
      tl.fromTo("#node-parent", { opacity: 0, x: -34, scale: 0.94, transformOrigin: "108px 44px" }, { opacity: 1, x: 0, scale: 1, duration: 0.62, ease: "back.out(1.4)" }, 0.9);
      tl.fromTo("#line-partner", { strokeDashoffset: 900, strokeDasharray: "18 14" }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 1.35);
      tl.fromTo("#node-partner", { opacity: 0, x: -34, scale: 0.94, transformOrigin: "108px 44px" }, { opacity: 1, x: 0, scale: 1, duration: 0.62, ease: "back.out(1.4)" }, 1.55);
      tl.fromTo("#node-child", { opacity: 0, x: 34, scale: 0.94, transformOrigin: "130px 44px" }, { opacity: 1, x: 0, scale: 1, duration: 0.72, ease: "back.out(1.2)" }, 2.15);
      tl.to("#ambient-shimmer", { opacity: 0.82, duration: 2.5, ease: "none" }, 0.8);
      tl.to(".tree-stage", { scale: 1.025, transformOrigin: "50% 50%", duration: 2.6, ease: "sine.inOut" }, 2.5);
      tl.to(".tree-stage", { scale: 1, duration: 1.2, ease: "sine.inOut" }, 5.1);
      window.__timelines["family-tree-intro"] = tl;
    </script>
  </body>
</html>
